<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="UX design case study by Diego Cárdenas Mora." />
    <meta name="robots" content="noindex, follow" />
    <title>Project — Diego Cárdenas Mora</title>
    <script>
      (() => {
        const urls = {
          "rural-healthcare": "/projects/rural-healthcare/",
          "app-redesign": "/projects/app-redesign/",
          "whatsapp-appointments": "/projects/whatsapp-appointments/",
          "maternal-health": "/projects/maternal-health/",
        };
        const id = new URLSearchParams(window.location.search).get("id");
        if (urls[id]) window.location.replace(`${urls[id]}${window.location.hash}`);
      })();
    </script>
    <link
      id="animated-favicon"
      rel="icon"
      type="image/svg+xml"
      href="assets/favicons/favicon-black.svg"
    />
    <link rel="stylesheet" href="project.css" />
    <script src="favicon.js" defer></script>
    <script src="cursor.js" defer></script>
    <script src="project-data.js" defer></script>
  </head>
  <body data-case-page="true">
    <header class="case-header">
      <a class="case-name" href="/">
        <span>Diego Cárdenas Mora</span>
        <span class="site-name-greet" aria-hidden="true">
          <img src="/assets/greet.svg" alt="" />
        </span>
      </a>
      <nav aria-label="Main navigation">
        <a href="/">Home</a>
        <a class="is-active" href="/#projects">Projects</a>
        <a href="/#services">Services</a>
        <a href="/#about">About</a>
        <a href="/#contact">Contact</a>
      </nav>
      <a class="case-logo" href="/#contact" aria-label="Go to contact">
        <img src="assets/logo.svg" alt="" />
      </a>
    </header>

    <div class="case-section-indicator" id="case-section-indicator" aria-hidden="true">
      <strong id="indicator-project-title"></strong>
      <div class="case-section-indicator-label" aria-live="polite">
        <span class="is-current" id="indicator-section-current"></span>
        <span class="is-next" id="indicator-section-next"></span>
      </div>
      <div class="case-reading-progress" aria-hidden="true">
        <span id="case-reading-progress-bar"></span>
      </div>
    </div>

    <main id="case-study">
      <section class="case-hero">
        <h1 id="project-title"></h1>
      </section>

      <section class="case-summary" data-section-title="Project Overview">
        <aside class="case-meta">
          <div>
            <h2>Skills</h2>
            <p id="project-skills"></p>
          </div>
          <div>
            <h2>Tools</h2>
            <p id="project-tools"></p>
          </div>
        </aside>
        <div class="case-overview">
          <h2>Project Overview</h2>
          <div id="project-overview"></div>
        </div>
      </section>

      <figure class="case-media" id="project-media">
        <div id="project-media-content">
          <span>Project image</span>
        </div>
        <figcaption id="project-media-caption">Visual material will be added here.</figcaption>
      </figure>

      <div id="project-sections"></div>

      <nav class="case-next" aria-label="Project navigation">
        <p>Next project</p>
        <a id="next-project" href="#">
          <span id="next-project-title"></span>
          <img src="assets/arrow-up-right.svg" alt="" />
        </a>
      </nav>

      <section class="case-contact-cta" data-section-title="Want to work together?" aria-labelledby="case-contact-title">
        <h2 id="case-contact-title">Want to work<br />together?</h2>
        <a class="case-contact-link" href="mailto:diegohit@gmail.com">
          <span>diegohit@gmail.com</span>
          <img src="/assets/contact-arrow.svg" alt="" />
        </a>
        <a
          class="case-contact-link"
          href="https://www.linkedin.com/in/diego-cardenasm"
          target="_blank"
          rel="noreferrer"
        >
          <span>LinkedIn</span>
          <img src="/assets/contact-arrow.svg" alt="" />
        </a>
        <footer class="case-contact-footer">
          <p>© 2026 Diego Cárdenas Mora</p>
        </footer>
      </section>
    </main>

    <a class="case-back" href="/#projects">
      <img src="assets/arrow-up-right.svg" alt="" />
      <span>Back to projects</span>
    </a>
  </body>
</html>
